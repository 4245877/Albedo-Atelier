name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22.23.5"

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse committed private keys
        run: |
          marker='-----BEGIN'
          if git grep --cached -lI -E -e "$marker ((OPENSSH|RSA|DSA|EC|PGP|ENCRYPTED) )?PRIVATE KEY" -- .; then
            echo "::error::Private key material detected. Revoke the affected keys and review repository access."
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              exit "$grep_status"
            fi
            echo "No private key markers found in tracked files."
          fi

  print-orchestrator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/print-orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/print-orchestrator/package.json
          cache: true
          cache_dependency_path: apps/print-orchestrator/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (source and tests)
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests
        run: pnpm run test:integration

      - name: Complexity and file-size report
        run: pnpm run lint:complexity

      - name: Dependency vulnerability audit (production deps)
        run: pnpm audit --prod --audit-level moderate

  print-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/print-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dashboard unit tests
        run: npm test

      - name: Dashboard browser smoke tests
        env:
          CHROME_CDP_URL: http://127.0.0.1:9222
          CHROME_VERSION: "158.0.8127.36"
          CHROME_SHA256: 2d3a23017323c54fd457a678e4351f895c4076d8050e39d5aa6247f93448b73a
        run: |
          browser_dir="$(mktemp -d "$RUNNER_TEMP/atelier-chrome.XXXXXX")"
          archive="$browser_dir/chrome.zip"
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip" \
            -o "$archive"
          printf '%s  %s\n' "$CHROME_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$browser_dir"
          "$browser_dir/chrome-headless-shell-linux64/chrome-headless-shell" \
            --no-sandbox --disable-dev-shm-usage --user-data-dir="$browser_dir/profile" \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank \
            >"$browser_dir/chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent --max-time 1 "$CHROME_CDP_URL/json/version"; then
              npm run test:smoke
              exit
            fi
            if ! kill -0 "$chrome_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$browser_dir/chrome.log"
          echo "::error::Chrome did not become ready for the browser smoke tests."
          exit 1

      - name: Build the dashboard image
        run: docker build --tag atelier-print-dashboard:ci .

      - name: Validate nginx config in the built image
        run: |
          docker run --rm --network none \
            --add-host go2rtc:127.0.0.1 --add-host print-orchestrator:127.0.0.1 \
            --env ORCHESTRATOR_API_TOKEN=ci-placeholder atelier-print-dashboard:ci nginx -t

      - name: Image vulnerability scan (Trivy)
        id: scan
        run: bash ../../.github/scripts/scan-images.sh atelier-print-dashboard:ci

      - name: Upload image scan report
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-image-scan
          path: ${{ runner.temp }}/atelier-image-reports/*.json
          if-no-files-found: error
          retention-days: 14

  deploy-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Shell syntax and ShellCheck
        run: |
          for script in scripts/deploy.sh scripts/tests/deploy.test.sh scripts/tests/fake-{docker,curl} \
            ops/ensure-print-farm-network.sh ops/{backup,verify}/*.sh .github/scripts/scan-images.sh; do
            bash -n "$script"
          done
          sh -n apps/print-orchestrator/docker-entrypoint.sh
          shellcheck --severity=warning scripts/deploy.sh .github/scripts/scan-images.sh

      - name: Validate base and Orca Compose configuration
        env:
          GO2RTC_WEBRTC_CANDIDATE: 127.0.0.1:8555
          K2_CAMERA_SOURCE: webrtc://127.0.0.1:9999
          ORCA_HOST_DIR: /opt/orca-ci
          ORCA_SLICER_CMD: /opt/orca/AppRun
        run: |
          docker compose --env-file .env.example -f compose.yml config --quiet
          docker compose --env-file .env.example -f compose.yml -f compose.orca.yml config --quiet

      - name: Deploy and rollback scenarios (fake Docker)
        run: ./scripts/tests/deploy.test.sh

  orchestrator-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build both orchestrator images
        run: |
          for target in production production-orca; do
            docker build --target "$target" --tag "atelier-print-orchestrator:$target" apps/print-orchestrator
          done

      - name: Check readiness with disposable data
        run: |
          for target in production production-orca; do
            name="atelier-ci-$target"
            docker run --detach --name "$name" --network none \
              --env PRINTERS_CONFIG_JSON='[]' --env ORCHESTRATOR_API_TOKEN=ci-placeholder \
              "atelier-print-orchestrator:$target"
            trap 'docker rm -f "$name" >/dev/null' EXIT
            ready=false
            for _ in {1..30}; do
              if docker exec "$name" node -e "fetch('http://127.0.0.1:3100/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs "$name"
              echo "::error::$target did not become ready."
              exit 1
            fi
            docker rm -f "$name"
            trap - EXIT
          done

      - name: Image vulnerability scans (Trivy)
        id: scan
        run: |
          bash .github/scripts/scan-images.sh \
            atelier-print-orchestrator:production atelier-print-orchestrator:production-orca

      - name: Upload image scan reports
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orchestrator-image-scans
          path: ${{ runner.temp }}/atelier-image-reports/*.json
          if-no-files-found: error
          retention-days: 14
